name: API Workflow

on:
  workflow_call:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chrome Browser
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium

      - name: Install Chromium only
        run: npx playwright install chromium

      - name: Generate storageState only
        run: npx tsx scripts/generate-storage-state.ts

      - name: Verify storage state file
        shell: bash
        run: |
          FILE="playwright/.auth/storageState.json"

          # Check file exists
          if [ ! -f "$FILE" ]; then
            echo "Storage state file not found: $FILE!"
            exit 1
          fi

          # Check file is not empty
          if [ ! -s "$FILE" ]; then
            echo "Storage state file is empty!"
            exit 1
          fi

          # Validate JSON structure
          jq -e '
            has("cookies") and
            has("origins")
          ' "$FILE" > /dev/null || {
            echo "Invalid storage state structure"
            exit 1
          }

          # Ensure authentication data exists
          COOKIE_COUNT=$(jq '.cookies | length' "$FILE")
          ORIGIN_COUNT=$(jq '.origins | length' "$FILE")

          if [ "$COOKIE_COUNT" -eq 0 ] && [ "$ORIGIN_COUNT" -eq 0 ]; then
            echo "Storage state contains no authentication data"
            exit 1
          fi

          echo "Storage state validation passed"
          echo "Cookies: $COOKIE_COUNT"
          echo "Origins: $ORIGIN_COUNT"


      - name: Run API Tests (Blob)
        continue-on-error: true
        run: npx playwright test tests/api/employee.spec.ts

      - name: Prepare API JSON
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json api-results.json

      - name: Verify API JSON Exists
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json api-results.json

      - name: Upload API Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-blob
          path: blob-report

      - name: Upload API JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-json
          path: api-results.json
