name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests (Blob)
        continue-on-error: true
        run: |
          npx playwright test tests/ui \
          --reporter=blob,json
          mv test-results.json ui-results.json

      - name: Upload UI Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-blob
          path: blob-report

      - name: Upload UI JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-json
          path: ui-results.json

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run API Tests (Blob)
        continue-on-error: true
        run: |
          npx playwright test tests/api \
            --reporter=blob,json
          mv test-results.json api-results.json

      - name: Upload API Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-blob
          path: blob-report

      - name: Upload API JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-json
          path: api-results.json

  merge-report:
    name: Merge Playwright Report
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Download UI Blob
        uses: actions/download-artifact@v4
        with:
          name: ui-blob
          path: merged

      - name: Download API Blob
        uses: actions/download-artifact@v4
        with:
          name: api-blob
          path: merged

      - name: Download UI JSON
        uses: actions/download-artifact@v4
        with:
          name: ui-json
          path: reports

      - name: Download API JSON
        uses: actions/download-artifact@v4
        with:
          name: api-json
          path: reports

      - name: Merge Reports (Single HTML)
        run: npx playwright merge-reports --reporter html merged

      - name: Upload Merged HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report

      - name: Generate HTML Email Dashboard
        run: |
          node << 'EOF'
          const fs = require('fs');

          const summary = fs.existsSync('summary.txt')
            ? fs.readFileSync('summary.txt', 'utf-8')
            : 'No summary available';

          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const html = `
          <html>
          <body style="font-family: Arial; background:#f6f8fa; padding:20px;">

            <div style="background:#ffffff; padding:20px; border-radius:10px;">
              <h2 style="color:#24292f;"> Playwright Test Dashboard</h2>

              <pre style="background:#f3f3f3; padding:10px; border-radius:6px;">
            ${summary}
              </pre>

              <p>
                <b>GitHub Run:</b><br>
                <a href="${runUrl}">${runUrl}</a>
              </p>

              <p style="color:#57606a;">
                Generated automatically by GitHub Actions
              </p>
            </div>

          </body>
          </html>
          `;

          fs.writeFileSync('email.html', html);
          console.log('HTML email generated');
          EOF

      - name: Generate Combined Summary
        if: always()
        run: |
          node << 'EOF'
          const fs = require('fs');

          const files = [
            'reports/ui-results.json',
            'reports/api-results.json'
          ];

          let total = 0;
          let passed = 0;
          let failed = 0;
          let flaky = 0;

          const failedTests = [];

          function processSuite(suite) {
            if (suite.specs) {
              for (const spec of suite.specs) {
                for (const test of (spec.tests || [])) {

                  total++;

                  const results = test.results || [];

                  const hasPassed = results.some(r => r.status === 'passed');
                  const hasFailed = results.some(r => r.status === 'failed');

                  if (hasPassed && hasFailed) {
                    flaky++;
                  } else if (hasPassed) {
                    passed++;
                  } else {
                    failed++;
                  }

                  if (hasFailed) {
                    failedTests.push({
                      title: spec.title,
                      retries: results.length - 1
                    });
                  }
                }
              }
            }

            for (const child of (suite.suites || [])) {
              processSuite(child);
            }
          }

          for (const file of files) {

            if (!fs.existsSync(file)) continue;

            const report = JSON.parse(
              fs.readFileSync(file, 'utf8')
            );

            for (const suite of (report.suites || [])) {
              processSuite(suite);
            }
          }

          const runUrl =
            `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          let summary = `
          PLAYWRIGHT EXECUTION SUMMARY
          ============================

          Total Tests Executed : ${total}
          Passed              : ${passed}
          Failed              : ${failed}
          Flaky / Retried     : ${flaky}

          Failed Tests
          ------------
          `;

            if (failedTests.length === 0) {
              summary += 'None\n';
            } else {
              failedTests.forEach(t => {
                summary += `- ${t.title} (Retries: ${t.retries})\n`;
              });
            }

            summary += `
          Artifacts:
          ${runUrl}

          Failure Screenshots/Logs:
          Download from workflow artifacts:
          - merged-playwright-report
          - playwright-results
          `;

            fs.writeFileSync('summary.txt', summary);

          console.log(summary);
          EOF

      - name: Compress Results
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          zip -r playwright-results-$TIMESTAMP.zip \
                playwright-report \
                blob-report \
                test-results \
                email.html \
                summary.txt 

          echo "ZIP_FILE=playwright-results-$TIMESTAMP.zip" >> $GITHUB_ENV

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            *.zip

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Test Report - Run #${{ github.run_number }}
          to: mr_joe8888@yahoo.com
          from: CI Bot <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email.html
          attachments: summary.txt
