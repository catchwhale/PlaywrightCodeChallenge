name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright UI + API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: 1️⃣ Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      - name: 2️⃣ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================================================
      # 3. Install dependencies
      # =========================================================
      - name: 3️⃣ Install Dependencies
        run: npm ci

      # =========================================================
      # 4. Install Playwright browsers
      # =========================================================
      - name: 4️⃣ Install Playwright Browsers
        run: npx playwright install --with-deps

      # =========================================================
      # 5. Prepare directories (prevents ENOENT errors)
      # =========================================================
      - name: 5️⃣ Prepare Directories
        run: mkdir -p test-results playwright-report

      # =========================================================
      # 6. Run Playwright tests (UI + API)
      # =========================================================
      - name: 6️⃣ Run Playwright Tests
        run: npx playwright test --reporter=html,junit

      # =========================================================
      # 7. Upload HTML report
      # =========================================================
      - name: 7️⃣ Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

      # =========================================================
      # 8. Upload JUnit results
      # =========================================================
      - name: 8️⃣ Upload JUnit Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/

      # =========================================================
      # 9. Generate test summary (SAFE + PRETTY)
      # =========================================================
      - name: 9️⃣ Generate Test Summary
        id: summary
        run: |
          node << 'EOF'
          const fs = require('fs');

          const file = 'test-results/junit.xml';

          // =====================================================
          // 9.1 Check if JUnit file exists (prevents crash)
          // =====================================================
          if (!fs.existsSync(file)) {
            const emptySummary = [
              "Playwright Test Report",
              "",
              "⚠️ No test results generated."
            ].join("\n");

            fs.writeFileSync('summary.txt', emptySummary);
            console.log(emptySummary);
            process.exit(0);
          }

          // =====================================================
          // 9.2 Read XML report
          // =====================================================
          const xml = fs.readFileSync(file, 'utf-8');

          // =====================================================
          // 9.3 Extract test metrics
          // =====================================================
          const total = (xml.match(/<testcase/g) || []).length;
          const failed = (xml.match(/<failure/g) || []).length;
          const skipped = (xml.match(/<skipped/g) || []).length;
          const passed = total - failed - skipped;

          // =====================================================
          // 9.4 Build clean formatted summary
          // =====================================================
          const summary = [
            "📊 Playwright Test Report",
            "=========================",
            "",
            `1️⃣ Total Tests  : ${total}`,
            `2️⃣ Passed Tests : ${passed}`,
            `3️⃣ Failed Tests : ${failed}`,
            `4️⃣ Skipped Tests: ${skipped}`,
            "",
            "========================="
          ].join("\n");

          // =====================================================
          // 9.5 Write summary file
          // =====================================================
          fs.writeFileSync('summary.txt', summary);

          console.log(summary);
          EOF

      # =========================================================
      # 10. Upload summary artifact
      # =========================================================
      - name: 1️⃣0️⃣ Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: summary.txt

      # =========================================================
      # 11. Send email report
      # =========================================================
      - name: 1️⃣1️⃣ Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true

          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}

          subject: "📊 Playwright Test Report - Run #${{ github.run_number }}"

          to: your_email@gmail.com

          from: CI Bot <${{ secrets.EMAIL_USER }}>

          body: |
            Hello,

            Your Playwright test execution has completed.

            📌 Summary is attached as an artifact in GitHub Actions:
            - test-summary
            - playwright-report (HTML with screenshots/logs)
            - junit-results

            🔗 View Run:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            CI Automation Bot
