name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests (Blob)
        continue-on-error: true
        run: |
          npx playwright test tests/ui

      - name: Prepare UI JSON
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json ui-results.json

      - name: Verify UI JSON Exists
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json ui-results.json

      - name: Upload UI Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-blob
          path: blob-report

      - name: Upload UI JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-json
          path: ui-results.json

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run API Tests (Blob)
        continue-on-error: true
        run: |
          npx playwright test tests/api

      - name: Prepare API JSON
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json api-results.json

      - name: Verify API JSON Exists
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json api-results.json

      - name: Upload API Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-blob
          path: blob-report

      - name: Upload API JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-json
          path: api-results.json

  merge-report:
    name: Merge Playwright Report
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Download UI Blob
        uses: actions/download-artifact@v4
        with:
          name: ui-blob
          path: merged

      - name: Download API Blob
        uses: actions/download-artifact@v4
        with:
          name: api-blob
          path: merged

      - name: Download UI JSON
        uses: actions/download-artifact@v4
        with:
          name: ui-json
          path: results

      - name: Download API JSON
        uses: actions/download-artifact@v4
        with:
          name: api-json
          path: results

      - name: Merge Reports (Single HTML)
        run: npx playwright merge-reports --reporter html merged

      - name: Upload Merged HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report

      - name: Merge UI + API Results
        run: |
          node << 'EOF'
          const fs = require('fs');

          //Ensure output directory exists
          fs.mkdirSync('results/ui', { recursive: true });
          fs.mkdirSync('results/api', { recursive: true });
          fs.mkdirSync('results/combined', { recursive: true });

          const uiFile = 'results/ui-results.json';
          const apiFile = 'results/api-results.json';

          function load(file) {
            if (!fs.existsSync(file)) return null;
            return JSON.parse(fs.readFileSync(file, 'utf8'));
          }

          const ui = load(uiFile);
          const api = load(apiFile);

          const merged = {
            summary: {
              ui: ui ? ui.stats : null,
              api: api ? api.stats : null
            },
            suites: [
              ...(ui?.suites || []),
              ...(api?.suites || [])
            ]
          };

          fs.writeFileSync(
            'results/combined-results.json',
            JSON.stringify(merged, null, 2)
          );

          console.log('Merged JSON created successfully');
          EOF

      - name: Generate HTML Email Dashboard
        run: |
          node << 'EOF'
          const fs = require('fs');

          const summary = fs.existsSync('summary.txt')
            ? fs.readFileSync('summary.txt', 'utf-8')
            : 'No summary available';

          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;

          const html = `
          <html>
          <body style="font-family: Arial; background:#f6f8fa; padding:20px;">

            <div style="background:#ffffff; padding:20px; border-radius:10px;">
              <h2 style="color:#24292f;"> Playwright Test Dashboard</h2>

              <pre style="background:#f3f3f3; padding:10px; border-radius:6px;">
            ${summary}
              </pre>

              <p>
                <b>GitHub Run:</b><br>
                <a href="${runUrl}">${runUrl}</a>
              </p>

              <p style="color:#57606a;">
                Generated automatically by GitHub Actions
              </p>
            </div>

          </body>
          </html>
          `;

          fs.writeFileSync('email.html', html);
          console.log('HTML email generated');
          EOF

      - name: Generate Combined Summary
        run: |
          node << 'EOF'
          const fs = require('fs');

          let total = 0;
          let passed = 0;
          let failed = 0;
          let flaky = 0;

          const failedTests = [];
          const flakyTests = [];

          // REPLACE OLD processSuite-based logic
          function processTest(test) {
            const results = test.results || [];

            total++;

            const isFlaky =
              results.length > 1 &&
              results[0]?.status === 'failed' &&
              results.some(r => r.status === 'passed');

            if (isFlaky) {
              flaky++;
              flakyTests.push({
                title: test.title,
                retries: results.length - 1
              });
            } else if (results.some(r => r.status === 'passed')) {
              passed++;
            } else {
              failed++;
              failedTests.push({
                title: test.title,
                retries: results.length - 1
              });
            }
          }

          function processSuite(suite) {
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {
                processTest(test);
              }
            }

            for (const child of suite.suites || []) {
              processSuite(child);
            }
          }

          const files = [
            'test-results/ui-results.json',
            'test-results/api-results.json'
          ];

          for (const file of files) {
            if (!fs.existsSync(file)) continue;

            const report = JSON.parse(fs.readFileSync(file, 'utf8'));

            for (const suite of report.suites || []) {
              processSuite(suite);
            }
          }

          console.log({ total, passed, failed, flaky });
          EOF

      - name: Compress Results
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          zip -r playwright-results-$TIMESTAMP.zip \
                playwright-report \
                blob-report \
                test-results \
                email.html \
                summary.txt 

          echo "ZIP_FILE=playwright-results-$TIMESTAMP.zip" >> $GITHUB_ENV

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            *.zip

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Test Report - Run #${{ github.run_number }}
          to: mr_joe8888@yahoo.com
          from: CI Bot <${{ secrets.GMAIL_USERNAME }}>
          html_body: file://email.html
          attachments: summary.txt
