name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests (Blob)
        run: npx playwright test tests/ui --reporter=blob

      - name: Upload UI Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-blob
          path: blob-report

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run API Tests (Blob)
        run: npx playwright test tests/api --reporter=blob

      - name: Upload API Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-blob
          path: blob-report

  merge-report:
    name: Merge Playwright Report
    runs-on: ubuntu-latest
    needs: [ui-tests, api-tests]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Download UI Blob
        uses: actions/download-artifact@v4
        with:
          name: ui-blob
          path: merged

      - name: Download API Blob
        uses: actions/download-artifact@v4
        with:
          name: api-blob
          path: merged

      - name: Merge Reports (Single HTML)
        run: |
          npx playwright merge-reports --reporter html merged

      - name: Upload Merged HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report

      - name: Compress Results
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          zip -r playwright-results-$TIMESTAMP.zip \ 
          playwright-report \ 
          blob-report \ 
          test-results || true
          echo "ZIP_FILE=playwright-results-$TIMESTAMP.zip" >> $GITHUB_ENV

      - name: Upload Combined Artifact
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            *.zip

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Test Report - Run #${{ github.run_number }}
          to: mr_joe8888@yahoo.com
          from: CI Bot <${{ secrets.GMAIL_USERNAME }}>
          body: |
            Hello,

             Your Playwright test execution has completed.

            📌 Summary:
            - UI + API tests executed
            - Merged HTML report generated
            - ZIP file attached with full artifacts

            Run Details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            CI Automation Bot

            attachments: ${{ env.ZIP_FILE }}
