name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Playwright UI + API Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        suite:
          - ui
          - api

    steps:
      # =========================================================
      # 1. Checkout repository
      # =========================================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================================================
      # 3. Install dependencies
      # =========================================================
      - name: Install Dependencies
        run: npm ci

      # =========================================================
      # 4. Install Playwright browsers
      # =========================================================
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # =========================================================
      # 5. Prepare directories
      # =========================================================
      - name: Prepare Directories
        run: mkdir -p test-results playwright-report

      # =========================================================
      # 6. Run Playwright tests
      # =========================================================
      - name: Run Playwright ${{ matrix.suite }} Tests
        run: |
          npx playwright test tests/${{ matrix.suite }} \
           --reporter=html,junit \
            --workers=${{ github.run_attempt == 1 && 4 || 2 }}

      # =========================================================
      # 7. Compress test results + reports
      # =========================================================
      - name: Compress Test Results
        if: always()
        run: |
          echo "Compressing Playwright results..."

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)

          # Create zip file with timestamp
          zip -r test-results-$TIMESTAMP.zip test-results playwright-report || true

          echo "ZIP_FILE=test-results-$TIMESTAMP.zip" >> $GITHUB_ENV

      # =========================================================
      # 8. Upload ZIP artifact
      # =========================================================
      - name: Upload ZIP Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            *.zip
            summary.txt

      # =========================================================
      # 9. Generate test summary
      # =========================================================
      - name: Generate Test Summary
        if: always()
        run: |
          node << 'EOF'
          const fs = require('fs');

          const file = 'test-results/junit.xml';

          if (!fs.existsSync(file)) {
            const summary = [
              "Playwright Test Report",
              "",
              "No test results generated."
            ].join("\n");

            fs.writeFileSync('summary.txt', summary);
            console.log(summary);
            process.exit(0);
          }

          const xml = fs.readFileSync(file, 'utf-8');

          const total = (xml.match(/<testcase/g) || []).length;
          const failed = (xml.match(/<failure/g) || []).length;
          const skipped = (xml.match(/<skipped/g) || []).length;
          const passed = total - failed - skipped;

          const summary = [
            "Playwright Test Report",
            "=========================",
            "",
            `Total Tests  : ${total}`,
            `Passed       : ${passed}`,
            `Failed       : ${failed}`,
            `Skipped      : ${skipped}`,
            "",
            "========================="
          ].join("\n");

          fs.writeFileSync('summary.txt', summary);
          console.log(summary);
          EOF

      # =========================================================
      # 10. Upload summary artifact
      # =========================================================
      - name: Upload Summary Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: summary.txt

      # =========================================================
      # 11. Send email report
      # =========================================================
      - name: Send Email Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASS }}
          subject: "Playwright Test Report - Run #${{ github.run_number }}"
          to: your_email@gmail.com
          from: CI Bot <${{ secrets.EMAIL_USER }}>
          body: |
            Hello,

            Your Playwright test execution has completed.

            Artifacts:
            - Zipped test results (screenshots, traces, reports)
            - HTML report
            - Test summary

            Run Details:
            https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Regards,
            CI Automation Bot
