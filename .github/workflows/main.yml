name: Playwright Tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  ui:
    uses: ./.github/workflows/ui-tests.yml

  api:
    uses: ./.github/workflows/api-tests.yml

  merge-report:
    name: Merge Playwright Report
    runs-on: ubuntu-latest
    needs: [ui, api]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download UI Blob
        uses: actions/download-artifact@v4
        with:
          name: ui-blob
          path: blobs/ui

      - name: Download API Blob
        uses: actions/download-artifact@v4
        with:
          name: api-blob
          path: blobs/api

      - name: Verify Downloaded Artifacts
        run: |
          echo "=== BLOBS ==="
          ls -R blobs || true

      - name: Merge Playwright Reports
        run: |
          npx playwright merge-reports blobs --reporter html

      - name: Verify Merged Report
        run: |
          ls -R playwright-report || true

          if [ ! -f playwright-report/index.html ]; then
            echo "Merged report not found"
            exit 1
          fi

      - name: Generate JSON Report
        run: |
          npx playwright merge-reports blobs --reporter json > merged-report.json

      - name: Verify JSON Report
        run: |
          test -f merged-report.json
          cat merged-report.json | head -20

      - name: Print Test Summary
        run: |
          node scripts/print-summary.js

      - name: Upload Merged Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report

      - name: Generate HTML Dashboard
        run: |
          node scripts/generate-dashboard.js

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dashboard
          path: |
            playwright-dashboard.html
            email.html

      - name: Load Email Body
        run: |
          {
            echo 'HTML_BODY<<EOF'
            cat playwright-dashboard.html
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Send Email Report
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Test Report - Run #${{ github.run_number }}
          to: mr_joe8888@yahoo.com
          from: CI Bot Automation <${{ secrets.GMAIL_USERNAME }}>
          html_body: ${{ env.HTML_BODY }}
          attachments: playwright-dashboard.html