name: Playwright Tests

on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  ui:
    uses: ./.github/workflows/ui-tests.yml

  api:
    uses: ./.github/workflows/api-tests.yml

  merge-report:
    name: Merge Playwright Report
    runs-on: ubuntu-latest
    needs: [ui, api]
    if: always()

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Download UI Blob
        uses: actions/download-artifact@v4
        with:
          name: ui-blob
          path: blobs

      - name: Download API Blob
        uses: actions/download-artifact@v4
        with:
          name: api-blob
          path: blobs

      - name: Verify blobs
        run: ls -R blobs

      - name: Merge Playwright Reports
        run: npx playwright merge-reports blobs --reporter html

      - name: Generate JSON Summary Report
        run: npx playwright merge-reports blobs --reporter json > merged-report.json

      - name: Write GitHub Summary
        run: |
          node -e "
          const report = require('./merged-report.json');

          let passed = 0;
          let failed = 0;
          let skipped = 0;
          let flaky = 0;

          for (const suite of report.suites || []) {
            for (const spec of suite.specs || []) {
              for (const test of spec.tests || []) {

                const results = test.results || [];

                const hasPassed = results.some(r => r.status === 'passed');
                const hasFailed = results.some(r => r.status === 'failed');
                const hasSkipped = results.some(r => r.status === 'skipped');

                if (hasSkipped) skipped++;
                else if (hasPassed && hasFailed) flaky++;
                else if (hasPassed) passed++;
                else if (hasFailed) failed++;
              }
            }
          }

          const fs = require('fs');

          const summary =
            `## Playwright Test Summary

            - ✅ Passed: ${passed}
            - ❌ Failed: ${failed}
            - ⏭ Skipped: ${skipped}
            - ⚠️ Flaky: ${flaky}`

          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          "

      - name: Print Test Summary
        run: |
          node -e "
            const report = require('./merged-report.json');

            let passed = 0;
            let failed = 0;
            let skipped = 0;
            let flaky = 0;

            for (const suite of report.suites || []) {
              for (const spec of suite.specs || []) {
                for (const test of spec.tests || []) {
                  const results = test.results || [];

                  const hasPassed = results.some(r => r.status === 'passed');
                  const hasFailed = results.some(r => r.status === 'failed');
                  const hasSkipped = results.some(r => r.status === 'skipped');

                  if (hasSkipped) {
                    skipped++;
                  } else if (hasPassed && hasFailed) {
                    flaky++;
                  } else if (hasPassed) {
                    passed++;
                  } else if (hasFailed) {
                    failed++;
                  }
                }
              }
            }

            console.log('==============================');
            console.log(' PLAYWRIGHT TEST SUMMARY');
            console.log('==============================');
            console.log('Passed :', passed);
            console.log('Failed :', failed);
            console.log('Skipped:', skipped);
            console.log('Flaky  :', flaky);
            console.log('==============================');
            "

      - name: Upload Merged Report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report

      - name: Generate HTML Dashboard
        run: node scripts/generate-dashboard.js

      - name: Upload Dashboard
        uses: actions/upload-artifact@v4
        with:
          name: playwright-dashboard
          path: |
            playwright-dashboard.html
            email.html

      - name: Load HTML
        shell: bash
        run: |
          {
            echo 'HTML_BODY<<EOF'
            cat playwright-dashboard.html
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Send Email Report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USERNAME }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: Playwright Test Report - Run
          to: mr_joe8888@yahoo.com
          from: CI Bot Automation <${{ secrets.GMAIL_USERNAME }}>
          html_body: ${{ env.HTML_BODY }}
          attachments: playwright-dashboard.html