name: UI Workflow

on:
  workflow_call:

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run UI Tests (Blob)
        continue-on-error: true
        run: |
          npx playwright test tests/ui

      - name: Prepare UI JSON
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json ui-results.json

      - name: Verify UI JSON Exists
        if: always()
        run: |
          ls -la
          test -f test-results.json
          cp test-results.json ui-results.json

      - name: Upload UI Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-blob
          path: blob-report

      - name: Upload UI JSON Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-json
          path: ui-results.json
